name: Publish Pages
on:
  workflow_run:
    workflows: [Site checks]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Check main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$current" = "$RELEASE_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping an obsolete main revision.'
          fi
      - if: steps.revision.outputs.current == 'true'
        run: bun install --frozen-lockfile
      - name: Download verified artifact
        if: steps.revision.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "site-$RELEASE_SHA" --dir dist
      - name: Publish the same artifact
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/cloudflare/publish.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-receipt-${{ github.event.workflow_run.head_sha }}
          path: cloudflare-deployment.json
          if-no-files-found: ignore
          retention-days: 30
