<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="960" viewBox="0 0 840 960" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">確認してから、実行するまで</title><desc id="desc">アシスタントが変更案を示す → 私が内容を確認して承認 → 今、実行できる？ → 確認した変更を実行 → 結果を知らせる; まだ実行しない: 拒否または保留</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657c" /></marker>
<style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#20334a} .title{font-size:28px;font-weight:700} .label{font-size:23px;font-weight:600} .sub{font-size:18px;fill:#52657c} .edge{fill:none;stroke:#52657c;stroke-width:2;marker-end:url(#arrow)} .tag{font-size:16px;fill:#52657c}</style></defs>
<rect width="840" height="960" rx="18" fill="#f6f8fb" />
<text x="36" y="48" class="title" text-anchor="start" id="text0">確認してから、実行するまで</text>
<text x="36" y="82" class="sub" text-anchor="start" id="text1">設計イメージ · 一連の動作は検証待ち</text>
<rect x="40" y="120" width="440" height="85" rx="12" fill="#fff" stroke="#bac9d9" stroke-width="1.5" />
<text x="260" y="154" class="label" text-anchor="middle" id="text2">アシスタントが変更案を示す</text>
<text x="260" y="182" class="sub" text-anchor="middle" id="text3">どの予定をどう変え、誰に知らせるか</text>
<rect x="40" y="260" width="440" height="85" rx="12" fill="#fff" stroke="#bac9d9" stroke-width="1.5" />
<text x="260" y="294" class="label" text-anchor="middle" id="text4">私が内容を確認して承認</text>
<text x="260" y="322" class="sub" text-anchor="middle" id="text5">今回の具体的な変更を確認</text>
<path d="M260 390L480 465L260 540L40 465Z" fill="#eaf0f7" stroke="#4268a0" stroke-width="1.5" />
<text x="260" y="460" class="label" text-anchor="middle" id="text6">今、実行できる？</text>
<text x="260" y="489" class="sub" text-anchor="middle" id="text7">承認も状況も変わらない</text>
<rect x="40" y="610" width="440" height="85" rx="12" fill="#edf3ed" stroke="#98b49a" stroke-width="1.5" />
<text x="260" y="644" class="label" text-anchor="middle" id="text8">確認した変更を実行</text>
<text x="260" y="672" class="sub" text-anchor="middle" id="text9">承認された範囲だけを扱う</text>
<rect x="40" y="750" width="440" height="85" rx="12" fill="#fff" stroke="#bac9d9" stroke-width="1.5" />
<text x="260" y="784" class="label" text-anchor="middle" id="text10">結果を知らせる</text>
<text x="260" y="812" class="sub" text-anchor="middle" id="text11">成功・失敗・残っている作業</text>
<rect x="540" y="405" width="270" height="125" rx="12" fill="#fff4df" stroke="#d6b570" stroke-width="1.5" />
<text x="675" y="440" class="label" text-anchor="middle" id="text12">まだ実行しない</text>
<text x="675" y="473" class="sub" text-anchor="middle" id="text13">拒否または保留</text>
<text x="675" y="503" class="sub" text-anchor="middle" id="text14">理由を示し、必要なら再確認</text>
<path d="M260 205V260" class="edge" />
<path d="M260 345V390" class="edge" />
<path d="M260 540V610" class="edge" />
<text x="290" y="580" class="tag" text-anchor="start" id="text15">可能</text>
<path d="M260 695V750" class="edge" />
<path d="M480 302H675V405" class="edge" />
<text x="575" y="289" class="tag" text-anchor="middle" id="text16">未承認</text>
<path d="M480 465H540" class="edge" />
<text x="510" y="450" class="tag" text-anchor="middle" id="text17">不可</text>
<text x="36" y="908" class="sub" text-anchor="start" id="text18">変更内容や状況が変われば、もう一度確認する。</text>
<text x="36" y="940" class="sub" text-anchor="start" id="text19">同じ依頼の再送では、既存の結果を確認するだけ。</text>
</svg>