<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Yaaa architecture overview</title>
  <desc id="desc">Inputs and requests enter dialogue and reasoning. Action intents must pass an action gate before affecting external systems. Run records are organized and reviewed to update knowledge and procedures used in future tasks.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657c" /></marker>
    <style>
      text {font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;fill:#20334a}
      .title {font-size:27px;font-weight:700}
      .label {font-size:21px;font-weight:600}
      .sub {font-size:16px;fill:#52657c}
      .edge {fill:none;stroke:#52657c;stroke-width:2;marker-end:url(#arrow)}
      .box {fill:#fff;stroke:#bac9d9;stroke-width:1.5;rx:12}
    
text {font-family:"DejaVu Sans","Noto Sans",sans-serif;} .label {font-size:18px;} .sub {font-size:15px;}
</style>
  </defs>
  <rect width="1160" height="660" rx="18" fill="#f6f8fb" />
  <text x="42" y="53" class="title" id="label-0">Yaaa · Runtime and governance</text>
  <text x="42" y="85" class="sub" id="label-1">Conceptual relationships · Each capability is implemented and verified separately</text>
  <rect x="30" y="112" width="1100" height="282" rx="14" fill="#eaf0f7" />
  <text x="52" y="147" class="label" id="label-2">Current task</text>
  <rect x="55" y="187" width="180" height="100" class="box" />
  <text x="145" y="227" text-anchor="middle" class="label" id="label-3" style="font-size:15.46px">Inputs &amp; requests</text>
  <text x="145" y="248.0" text-anchor="middle" class="sub" id="label-4"><tspan x="145" dy="0">Keep sources</tspan><tspan x="145" dy="18">and context</tspan></text>
  <rect x="305" y="187" width="210" height="100" class="box" />
  <text x="410" y="227" text-anchor="middle" class="label" id="label-5" style="font-size:15.32px">Dialogue &amp; reasoning</text>
  <text x="410" y="248.0" text-anchor="middle" class="sub" id="label-6"><tspan x="410" dy="0">Use context through</tspan><tspan x="410" dy="18">permitted routes</tspan></text>
  <rect x="610" y="187" width="210" height="100" rx="12" fill="#fff" stroke="#4268a0" stroke-width="2" />
  <text x="715" y="227" text-anchor="middle" class="label" id="label-7">Action gate</text>
  <text x="715" y="257" text-anchor="middle" class="sub" id="label-8">Execute · Refuse · Defer</text>
  <rect x="900" y="187" width="190" height="100" class="box" />
  <text x="995" y="227" text-anchor="middle" class="label" id="label-9" style="font-size:17.18px">External systems</text>
  <text x="995" y="257" text-anchor="middle" class="sub" id="label-10">Scoped operations</text>
  <path d="M235 237H305" class="edge" />
  <path d="M515 237H610" class="edge" stroke-dasharray="6 5" />
  <text x="562" y="177" text-anchor="middle" class="sub" id="label-11">Action intent</text>
  <path d="M820 237H900" class="edge" />
  <text x="860" y="177" text-anchor="middle" class="sub" id="label-12">Approved action</text>
  <rect x="305" y="319" width="515" height="50" class="box" />
  <text x="562" y="351" text-anchor="middle" class="sub" id="label-13">Show answers, outcomes, and traceable records</text>
  <path d="M410 287V319" class="edge" />
  <path d="M715 287V319" class="edge" />
  <rect x="30" y="419" width="1100" height="193" rx="14" fill="#edf3ed" />
  <text x="52" y="455" class="label" id="label-14">Governance for future work</text>
  <rect x="55" y="480" width="200" height="90" class="box" />
  <text x="155" y="518" text-anchor="middle" class="label" id="label-15">Run records</text>
  <text x="155" y="538.0" text-anchor="middle" class="sub" id="label-16"><tspan x="155" dy="0">Results &amp; evidence</tspan><tspan x="155" dy="18">Failures</tspan></text>
  <rect x="345" y="480" width="210" height="90" class="box" />
  <text x="450" y="518" text-anchor="middle" class="label" id="label-17">Organize &amp; review</text>
  <text x="450" y="538.0" text-anchor="middle" class="sub" id="label-18"><tspan x="450" dy="0">Candidates &amp; evidence</tspan><tspan x="450" dy="18">Accept or revise</tspan></text>
  <rect x="670" y="480" width="420" height="90" class="box" />
  <text x="880" y="518" text-anchor="middle" class="label" id="label-19">Accepted knowledge &amp; methods</text>
  <text x="880" y="547" text-anchor="middle" class="sub" id="label-20">Long-term memory · SOPs · Policies · Procedures</text>
  <path d="M255 525H345" class="edge" />
  <path d="M555 525H670" class="edge" />
  <path d="M305 344H42V466H155V480" class="edge" />
  <path d="M1090 525H1114V155H410V187" class="edge" stroke-dasharray="6 5" />
  <text x="975" y="150" text-anchor="middle" class="sub" id="label-21">Used in future tasks</text>
  <text x="42" y="641" class="sub" id="label-22">Long-term changes are reviewed; components can run on their own schedules.</text>
</svg>