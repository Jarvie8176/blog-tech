<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="960" viewBox="0 0 840 960" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">From confirmation to action</title><desc id="desc">Assistant proposes a change → User reviews and approves → Can it proceed now? → Make the confirmed change → Report the outcome to the user; Do not proceed yet: Refuse or defer</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657c" /></marker>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#20334a} .title{font-size:28px;font-weight:700} .label{font-size:23px;font-weight:600} .sub{font-size:18px;fill:#52657c} .edge{fill:none;stroke:#52657c;stroke-width:2;marker-end:url(#arrow)} .tag{font-size:16px;fill:#52657c}</style></defs>
<rect width="840" height="960" rx="18" fill="#f6f8fb" />
<text x="36" y="48" class="title" text-anchor="start" id="text0">From confirmation to action</text>
<text x="36" y="82" class="sub" text-anchor="start" id="text1">Design sketch · The full flow still needs validation</text>
<rect x="40" y="120" width="440" height="85" rx="12" fill="#fff" stroke="#bac9d9" stroke-width="1.5" />
<text x="260" y="154" class="label" text-anchor="middle" id="text2">Assistant proposes a change</text>
<text x="260" y="182" class="sub" text-anchor="middle" id="text3" style="font-size:16.74px">Which event, what changes, and who to notify</text>
<rect x="40" y="260" width="440" height="85" rx="12" fill="#fff" stroke="#bac9d9" stroke-width="1.5" />
<text x="260" y="294" class="label" text-anchor="middle" id="text4">User reviews and approves</text>
<text x="260" y="322" class="sub" text-anchor="middle" id="text5">Approve this specific change</text>
<path d="M260 390L480 465L260 540L40 465Z" fill="#eaf0f7" stroke="#4268a0" stroke-width="1.5" />
<text x="260" y="460" class="label" text-anchor="middle" id="text6">Can it proceed now?</text>
<text x="260" y="489" class="sub" text-anchor="middle" id="text7">Still approved, unchanged</text>
<rect x="40" y="610" width="440" height="85" rx="12" fill="#edf3ed" stroke="#98b49a" stroke-width="1.5" />
<text x="260" y="644" class="label" text-anchor="middle" id="text8">Make the confirmed change</text>
<text x="260" y="672" class="sub" text-anchor="middle" id="text9">Stay within the approved scope</text>
<rect x="40" y="750" width="440" height="85" rx="12" fill="#fff" stroke="#bac9d9" stroke-width="1.5" />
<text x="260" y="784" class="label" text-anchor="middle" id="text10" style="font-size:21.89px">Report the outcome to the user</text>
<text x="260" y="812" class="sub" text-anchor="middle" id="text11" style="font-size:17.39px">What worked, what failed, and what remains</text>
<rect x="540" y="405" width="270" height="125" rx="12" fill="#fff4df" stroke="#d6b570" stroke-width="1.5" />
<text x="675" y="440" class="label" text-anchor="middle" id="text12" style="font-size:21.59px">Do not proceed yet</text>
<text x="675" y="473" class="sub" text-anchor="middle" id="text13">Refuse or defer</text>
<text x="675" y="503" class="sub" text-anchor="middle" id="text14" style="font-size:14.16px">Explain why; ask again if needed</text>
<path d="M260 205V260" class="edge" />
<path d="M260 345V390" class="edge" />
<path d="M260 540V610" class="edge" />
<text x="290" y="580" class="tag" text-anchor="start" id="text15">Yes</text>
<path d="M260 695V750" class="edge" />
<path d="M480 302H675V405" class="edge" />
<text x="575" y="289" class="tag" text-anchor="middle" id="text16">No approval</text>
<path d="M480 465H540" class="edge" />
<text x="510" y="450" class="tag" text-anchor="middle" id="text17">No</text>
<text x="36" y="908" class="sub" text-anchor="start" id="text18">If the change or situation changes, confirm again.</text>
<text x="36" y="940" class="sub" text-anchor="start" id="text19">Repeated requests only look up existing results.</text>
</svg>