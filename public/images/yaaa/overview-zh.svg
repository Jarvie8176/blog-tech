<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title desc" xml:lang="zh">
  <title id="title">Yaaa 架构概览</title>
  <desc id="desc">信息与任务进入对话和推理，行动意图经过执行边界后才能操作外部系统。运行记录经过整理与审阅，形成长期记忆及方法变更，再用于未来任务。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657c" /></marker>
    <style>
      text {font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;fill:#20334a}
      .title {font-size:27px;font-weight:700}
      .label {font-size:21px;font-weight:600}
      .sub {font-size:16px;fill:#52657c}
      .edge {fill:none;stroke:#52657c;stroke-width:2;marker-end:url(#arrow)}
      .box {fill:#fff;stroke:#bac9d9;stroke-width:1.5;rx:12}
    </style>
  </defs>
  <rect width="1160" height="660" rx="18" fill="#f6f8fb" />
  <text x="42" y="53" class="title" id="label-0">Yaaa · 运行与治理</text>
  <text x="42" y="85" class="sub" id="label-1">设计关系示意 · 具体能力分别实现与验证</text>
  <rect x="30" y="112" width="1100" height="282" rx="14" fill="#eaf0f7" />
  <text x="52" y="147" class="label" id="label-2">当前任务</text>
  <rect x="55" y="187" width="180" height="100" class="box" />
  <text x="145" y="227" text-anchor="middle" class="label" id="label-3">信息与请求</text>
  <text x="145" y="257" text-anchor="middle" class="sub" id="label-4">保留来源与上下文</text>
  <rect x="305" y="187" width="210" height="100" class="box" />
  <text x="410" y="227" text-anchor="middle" class="label" id="label-5">对话与推理</text>
  <text x="410" y="257" text-anchor="middle" class="sub" id="label-6">按允许的路径使用上下文</text>
  <rect x="610" y="187" width="210" height="100" rx="12" fill="#fff" stroke="#4268a0" stroke-width="2" />
  <text x="715" y="227" text-anchor="middle" class="label" id="label-7">行动执行边界</text>
  <text x="715" y="257" text-anchor="middle" class="sub" id="label-8">执行 · 拒绝 · 延后</text>
  <rect x="900" y="187" width="190" height="100" class="box" />
  <text x="995" y="227" text-anchor="middle" class="label" id="label-9">外部系统</text>
  <text x="995" y="257" text-anchor="middle" class="sub" id="label-10">范围明确的操作</text>
  <path d="M235 237H305" class="edge" />
  <path d="M515 237H610" class="edge" stroke-dasharray="6 5" />
  <text x="562" y="177" text-anchor="middle" class="sub" id="label-11">行动意图</text>
  <path d="M820 237H900" class="edge" />
  <text x="860" y="177" text-anchor="middle" class="sub" id="label-12">获准执行</text>
  <rect x="305" y="319" width="515" height="50" class="box" />
  <text x="562" y="351" text-anchor="middle" class="sub" id="label-13">呈现回答、处理结果与可追踪记录</text>
  <path d="M410 287V319" class="edge" />
  <path d="M715 287V319" class="edge" />
  <rect x="30" y="419" width="1100" height="193" rx="14" fill="#edf3ed" />
  <text x="52" y="455" class="label" id="label-14">面向未来工作的治理</text>
  <rect x="55" y="480" width="200" height="90" class="box" />
  <text x="155" y="518" text-anchor="middle" class="label" id="label-15">运行记录</text>
  <text x="155" y="547" text-anchor="middle" class="sub" id="label-16">结果 · 证据 · 失败</text>
  <rect x="345" y="480" width="210" height="90" class="box" />
  <text x="450" y="518" text-anchor="middle" class="label" id="label-17">整理与审阅</text>
  <text x="450" y="547" text-anchor="middle" class="sub" id="label-18">候选 · 依据 · 接受或修订</text>
  <rect x="670" y="480" width="420" height="90" class="box" />
  <text x="880" y="518" text-anchor="middle" class="label" id="label-19">被接受的知识与方法</text>
  <text x="880" y="547" text-anchor="middle" class="sub" id="label-20">长期记忆 · SOP · 策略 · 可执行流程</text>
  <path d="M255 525H345" class="edge" />
  <path d="M555 525H670" class="edge" />
  <path d="M305 344H42V466H155V480" class="edge" />
  <path d="M1090 525H1114V155H410V187" class="edge" stroke-dasharray="6 5" />
  <text x="975" y="150" text-anchor="middle" class="sub" id="label-21">用于未来任务</text>
  <text x="42" y="641" class="sub" id="label-22">长期变更经过审阅；组件可按各自节奏运行。</text>
</svg>