<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1070" viewBox="0 0 1160 1070" role="img" aria-labelledby="title desc">
<title id="title">Information integration · three layers</title><desc id="desc">Common records, interpretation, and shared reading windows solve different problems</desc>
<style>text{font-family:"Inter",sans-serif;fill:#172a3a;font-size:21px}.title{font-size:34px;font-weight:700}.head{font-size:25px;font-weight:600}.small{font-size:19px;fill:#425a6b}.mono{font-family:monospace;font-size:23px;fill:#126b70}.line{fill:none;stroke:#537d8a;stroke-width:3;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#537d8a"/></marker></defs>
<rect width="1160" height="1070" fill="#f8fafb"/>
<text x="40" y="65" class="title">Information integration · three layers</text>
<text x="40" y="107" class="small">Common records, interpretation, and shared reading windows solve different problems</text>
<rect x="40" y="150" width="1080" height="190" rx="14" fill="#ffffff" stroke="#b8cbd3" stroke-width="2"/>
<text x="65" y="192" class="head">01 · Collection</text>
<text x="65" y="235" class="">Update email + older newsletter</text>
<text x="65" y="274" class="">Common shape; two distinct records</text>
<text x="65" y="311" class="small">source_id + external_id · time · provenance</text>
<path d="M580 340 V380" class="line"/>
<rect x="40" y="385" width="1080" height="190" rx="14" fill="#ffffff" stroke="#b8cbd3" stroke-width="2"/>
<text x="65" y="427" class="head">02 · Interpretation</text>
<text x="65" y="470" class="">Each record + rules → verdict</text>
<text x="65" y="509" class="">priority · audience · summary · entities</text>
<text x="65" y="546" class="small">Established path: per-item triage</text>
<path d="M580 575 V615" class="line"/>
<rect x="40" y="620" width="1080" height="190" rx="14" fill="#ffffff" stroke="#b8cbd3" stroke-width="2"/>
<text x="65" y="662" class="head">03 · Presentation</text>
<text x="65" y="705" class="">Several verdicts → one delivery window</text>
<text x="65" y="744" class="">Ordering, indexes, optional overview</text>
<text x="65" y="781" class="small">Batching does not establish one shared event</text>
<rect x="40" y="890" width="1080" height="135" rx="14" fill="#fff4df" stroke="#b8cbd3" stroke-width="2"/>
<text x="65" y="936" class="head">Extensions · cross-source event matching, conflicts, live plans</text>
<text x="65" y="984" class="small">Require implementation and acceptance; combinations must retain source and sensitivity constraints</text>
</svg>