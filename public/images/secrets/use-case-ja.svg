<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1170" viewBox="0 0 1160 1170" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">空の項目から認証情報を使った実行まで</title><desc id="desc">目標の手順 · モデルは参照を使い、値はローカルで扱う</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52657c"/></marker><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#20334a} .title{font-size:29px} .label{font-size:21px} .sub{font-size:17px;fill:#52657c} .edge{fill:none;stroke:#52657c;stroke-width:2;marker-end:url(#arrow)} .box{fill:#ffffff;stroke:#bac9d9;stroke-width:1.5}</style></defs>
<rect width="1160" height="1170" rx="18" fill="#f6f8fb"/>
<text x="38" y="54" class="title">空の項目から認証情報を使った実行まで</text>
<text x="38" y="90" class="sub">目標の手順 · モデルは参照を使い、値はローカルで扱う</text>
<rect x="38" y="130" width="1084" height="145" rx="14" class="box"/>
<rect x="38" y="130" width="205" height="145" rx="14" fill="#eaf0f7"/>
<text x="140" y="180" text-anchor="middle" class="label">1</text>
<text x="140" y="224" text-anchor="middle" class="label">Agent</text>
<text x="275" y="168" text-anchor="start" class="label">基礎環境を準備</text>
<text x="275" y="209" text-anchor="start" class="sub">op・SOPS・age・envctl/bakctl</text>
<text x="275" y="242" text-anchor="start" class="sub">バージョンと recipient を確認し、合成値で検査</text>
<path d="M580 275 V310" class="edge"/>
<rect x="38" y="310" width="1084" height="145" rx="14" class="box"/>
<rect x="38" y="310" width="205" height="145" rx="14" fill="#eaf0f7"/>
<text x="140" y="360" text-anchor="middle" class="label">2</text>
<text x="140" y="404" text-anchor="middle" class="label">Agent</text>
<text x="275" y="348" text-anchor="start" class="label">op item の stub を作成</text>
<text x="275" y="389" text-anchor="start" class="sub">用途とフィールドを記録し、秘密は空欄に</text>
<text x="275" y="422" text-anchor="start" class="sub">項目の参照を返す</text>
<path d="M580 455 V490" class="edge"/>
<rect x="38" y="490" width="1084" height="145" rx="14" class="box"/>
<rect x="38" y="490" width="205" height="145" rx="14" fill="#e8e0cd"/>
<text x="140" y="540" text-anchor="middle" class="label">3</text>
<text x="140" y="584" text-anchor="middle" class="label">Human</text>
<text x="275" y="528" text-anchor="start" class="label">1Password に入力</text>
<text x="275" y="569" text-anchor="start" class="sub">人が用途・権限・期限を確認</text>
<text x="275" y="602" text-anchor="start" class="sub">会話には「入力済み」とだけ伝える</text>
<path d="M580 635 V670" class="edge"/>
<rect x="38" y="670" width="1084" height="145" rx="14" class="box"/>
<rect x="38" y="670" width="205" height="145" rx="14" fill="#eaf0f7"/>
<text x="140" y="720" text-anchor="middle" class="label">4</text>
<text x="140" y="764" text-anchor="middle" class="label">ローカルツール</text>
<text x="275" y="708" text-anchor="start" class="label">検査後に暗号化して保存</text>
<text x="275" y="749" text-anchor="start" class="sub">読み取り成功・非空・形式を確認して stdin へ</text>
<text x="275" y="782" text-anchor="start" class="sub">失敗時は元の carrier を保持し、状態だけ返す</text>
<path d="M580 815 V850" class="edge"/>
<rect x="38" y="850" width="1084" height="145" rx="14" class="box"/>
<rect x="38" y="850" width="205" height="145" rx="14" fill="#eaf0f7"/>
<text x="140" y="900" text-anchor="middle" class="label">5</text>
<text x="140" y="944" text-anchor="middle" class="label">業務プロセス</text>
<text x="275" y="888" text-anchor="start" class="label">envctl 経由で実行</text>
<text x="275" y="929" text-anchor="start" class="sub">業務プロセス内で認証情報を使う</text>
<text x="275" y="962" text-anchor="start" class="sub">結果を選別し、生の秘密を返さない</text>
<text x="38" y="1082" text-anchor="start" class="sub">誤露出を減らす手順。同権限の agent の隔離には別の境界が必要。</text>
<text x="38" y="1120" text-anchor="start" class="sub">demo-service · DEMO_API_TOKEN · service.env.enc</text>
</svg>