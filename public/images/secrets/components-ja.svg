<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1050" viewBox="0 0 1160 1050" role="img" aria-labelledby="title desc" xml:lang="ja">
<title id="title">認証情報スタックと envctl の論理構成</title><desc id="desc">配置用の接続とローカル実行は、それぞれの carrier を利用する</desc>
