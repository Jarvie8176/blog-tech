<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1170" viewBox="0 0 1160 1170" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">From an empty item to execution</title><desc id="desc">Target workflow · the model uses references; local tools handle values</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52657c"/></marker><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#20334a} .title{font-size:29px} .label{font-size:21px} .sub{font-size:17px;fill:#52657c} .edge{fill:none;stroke:#52657c;stroke-width:2;marker-end:url(#arrow)} .box{fill:#ffffff;stroke:#bac9d9;stroke-width:1.5}</style></defs>
<rect width="1160" height="1170" rx="18" fill="#f6f8fb"/>
<text x="38" y="54" class="title">From an empty item to execution</text>
<text x="38" y="90" class="sub">Target workflow · the model uses references; local tools handle values</text>
<rect x="38" y="130" width="1084" height="145" rx="14" class="box"/>
<rect x="38" y="130" width="205" height="145" rx="14" fill="#eaf0f7"/>
<text x="140" y="180" text-anchor="middle" class="label">1</text>
<text x="140" y="224" text-anchor="middle" class="label">Agent</text>
<text x="275" y="168" text-anchor="start" class="label">Prepare foundations</text>
<text x="275" y="209" text-anchor="start" class="sub">op, SOPS, age, envctl and bakctl</text>
<text x="275" y="242" text-anchor="start" class="sub">Check versions and recipients; use synthetic values</text>
<path d="M580 275 V310" class="edge"/>
<rect x="38" y="310" width="1084" height="145" rx="14" class="box"/>
<rect x="38" y="310" width="205" height="145" rx="14" fill="#eaf0f7"/>
<text x="140" y="360" text-anchor="middle" class="label">2</text>
<text x="140" y="404" text-anchor="middle" class="label">Agent</text>
<text x="275" y="348" text-anchor="start" class="label">Create an op item stub</text>
<text x="275" y="389" text-anchor="start" class="sub">Record purpose and fields; leave secrets empty</text>
<text x="275" y="422" text-anchor="start" class="sub">Return the item reference</text>
<path d="M580 455 V490" class="edge"/>
<rect x="38" y="490" width="1084" height="145" rx="14" class="box"/>
<rect x="38" y="490" width="205" height="145" rx="14" fill="#e8e0cd"/>
<text x="140" y="540" text-anchor="middle" class="label">3</text>
<text x="140" y="584" text-anchor="middle" class="label">Human</text>
<text x="275" y="528" text-anchor="start" class="label">Fill the item in 1Password</text>
<text x="275" y="569" text-anchor="start" class="sub">Confirm purpose, permissions and expiry</text>
<text x="275" y="602" text-anchor="start" class="sub">Tell the conversation only that it is filled</text>
<path d="M580 635 V670" class="edge"/>
<rect x="38" y="670" width="1084" height="145" rx="14" class="box"/>
<rect x="38" y="670" width="205" height="145" rx="14" fill="#eaf0f7"/>
<text x="140" y="720" text-anchor="middle" class="label">4</text>
<text x="140" y="764" text-anchor="middle" class="label">Local tool</text>
<text x="275" y="708" text-anchor="start" class="label">Validate and encrypt</text>
<text x="275" y="749" text-anchor="start" class="sub">Successful read, nonempty value, valid format; then stdin</text>
<text x="275" y="782" text-anchor="start" class="sub">Preserve the old carrier on failure; return status</text>
<path d="M580 815 V850" class="edge"/>
<rect x="38" y="850" width="1084" height="145" rx="14" class="box"/>
<rect x="38" y="850" width="205" height="145" rx="14" fill="#eaf0f7"/>
<text x="140" y="900" text-anchor="middle" class="label">5</text>
<text x="140" y="944" text-anchor="middle" class="label">Process</text>
<text x="275" y="888" text-anchor="start" class="label">Execute through envctl</text>
<text x="275" y="929" text-anchor="start" class="sub">The business process consumes credentials internally</text>
<text x="275" y="962" text-anchor="start" class="sub">Filter business results; do not return raw secrets</text>
<text x="38" y="1082" text-anchor="start" class="sub">This reduces accidental exposure; stronger isolation needs a separate boundary.</text>
<text x="38" y="1120" text-anchor="start" class="sub">demo-service · DEMO_API_TOKEN · service.env.enc</text>
</svg>