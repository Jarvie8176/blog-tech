<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">rmig 素材迁移流程</title><desc id="desc">审阅清单，复制到目标，核对文件结果，留下完成凭据；原始素材保留。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#27786b" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="760" rx="24" fill="#f4f7f2"/>
<g font-family="Noto Sans CJK SC, Noto Sans Mono CJK SC, sans-serif"><text x="64" y="65" font-size="24" fill="#27786b" font-weight="600">RMIG  /  素材迁移</text><text x="64" y="129" font-size="42" fill="#183c37" font-weight="700">复制之后，还要知道这批素材是否完整</text><text x="64" y="178" font-size="23" fill="#526b65" font-weight="400">操作流程示意 · 对应本文保留源文件的照片与视频迁移</text><rect x="64" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="90" y="284" font-size="24" fill="#27786b" font-weight="600">01</text><text x="90" y="337" font-size="30" fill="#183c37" font-weight="700">审阅素材清单</text><text x="90" y="391" font-size="22" fill="#526b65" font-weight="400">明确这一批有哪些文件</text><text x="90" y="429" font-size="22" fill="#526b65" font-weight="400">确定来源与目标位置</text><path d="M417 350 H434" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="438" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="464" y="284" font-size="24" fill="#27786b" font-weight="600">02</text><text x="464" y="337" font-size="30" fill="#183c37" font-weight="700">复制到目标</text><text x="464" y="391" font-size="22" fill="#526b65" font-weight="400">交给传输工具搬运</text><text x="464" y="429" font-size="22" fill="#526b65" font-weight="400">保留任务进度和日志</text><path d="M791 350 H808" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="812" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="838" y="284" font-size="24" fill="#27786b" font-weight="600">03</text><text x="838" y="337" font-size="30" fill="#183c37" font-weight="700">核对文件结果</text><text x="838" y="391" font-size="22" fill="#526b65" font-weight="400">检查完整性与内容校验</text><text x="838" y="429" font-size="22" fill="#526b65" font-weight="400">区分复制与验证结果</text><path d="M1165 350 H1182" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1186" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="1212" y="284" font-size="24" fill="#27786b" font-weight="600">04</text><text x="1212" y="337" font-size="30" fill="#183c37" font-weight="700">留下完成凭据</text><text x="1212" y="391" font-size="22" fill="#526b65" font-weight="400">保存清单和校验记录</text><text x="1212" y="429" font-size="22" fill="#526b65" font-weight="400">之后可以查询这一批</text><rect x="64" y="516" width="1472" height="92" rx="18" fill="#e5efe7" stroke="#c5d9cc" stroke-width="2"/><text x="90" y="553" font-size="25" fill="#183c37" font-weight="700">原始素材继续保留</text><text x="90" y="589" font-size="22" fill="#526b65" font-weight="400">图中没有自动删除；清理源文件是需要另行决定的步骤。</text><text x="64" y="665" font-size="24" fill="#526b65" font-weight="400">遇到异常：保留状态与日志，核对已经完成的部分，再决定如何继续。</text><text x="64" y="713" font-size="22" fill="#526b65" font-weight="400">历史结果查询已接入；自动状态变化通知仍待接通。</text></g></svg>