<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
<title id="title">Study material across devices</title><desc id="desc">Archiving, computer transfer and iPad reading are in place. OCR and study record lifecycle management are pending.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#27786b" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="540" rx="24" fill="#f4f7f2"/>
<g font-family="Noto Sans CJK SC, Noto Sans Mono CJK SC, sans-serif"><text x="64" y="65" font-size="24" fill="#27786b" font-weight="600">STUDY MATERIAL / ACROSS DEVICES</text><text x="64" y="127" font-size="40" fill="#183c37" font-weight="700">Bring archived material to the device you read on</text><rect x="64" y="185" width="450" height="145" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="90" y="240" font-size="26" fill="#183c37" font-weight="700">One archive</text><text x="90" y="290" font-size="20" fill="#526b65" font-weight="400">Keep study material in one place</text><path d="M522 259 H554" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="564" y="185" width="450" height="145" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="590" y="240" font-size="26" fill="#183c37" font-weight="700">Computer transfer and access</text><text x="590" y="290" font-size="20" fill="#526b65" font-weight="400">An existing flow to move and access files</text><path d="M1022 259 H1054" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1064" y="185" width="450" height="145" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="1090" y="240" font-size="26" fill="#183c37" font-weight="700">Read on iPad</text><text x="1090" y="290" font-size="20" fill="#526b65" font-weight="400">Bring the files to the reading device</text><rect x="64" y="378" width="1472" height="110" rx="18" fill="#faf9f5" stroke="#b7ae95" stroke-width="2" stroke-dasharray="9 7"/><text x="90" y="422" font-size="24" fill="#786a43" font-weight="600">Future work</text><text x="90" y="463" font-size="23" fill="#526b65" font-weight="400">OCR, backups and lifecycle management for study records remain on the task list.</text></g></svg>