<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">rmig による素材移行の流れ</title><desc id="desc">ファイル一覧を確認し、コピー、検証、完了記録の保存へ進みます。元の素材は保持します。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#27786b" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="760" rx="24" fill="#f4f7f2"/>
<g font-family="Noto Sans CJK JP, Noto Sans CJK SC, sans-serif"><text x="64" y="65" font-size="24" fill="#27786b" font-weight="600">RMIG / 素材の移行</text><text x="64" y="129" font-size="40" fill="#183c37" font-weight="700">コピーしたあと、素材がそろっているか確かめる</text><text x="64" y="178" font-size="23" fill="#526b65" font-weight="400">処理の流れの説明図 · 元ファイルを保持する写真・動画の移行</text><rect x="64" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="90" y="284" font-size="24" fill="#27786b" font-weight="600">01</text><text x="90" y="337" font-size="27" fill="#183c37" font-weight="700">ファイル一覧を確認</text><text x="90" y="391" font-size="21" fill="#526b65" font-weight="400">対象ファイルを確認する</text><text x="90" y="429" font-size="21" fill="#526b65" font-weight="400">移行元と移行先を決める</text><path d="M417 350 H434" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="438" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="464" y="284" font-size="24" fill="#27786b" font-weight="600">02</text><text x="464" y="337" font-size="27" fill="#183c37" font-weight="700">移行先にコピー</text><text x="464" y="391" font-size="21" fill="#526b65" font-weight="400">転送ツールで移動する</text><text x="464" y="429" font-size="21" fill="#526b65" font-weight="400">進捗とジョブログを残す</text><path d="M791 350 H808" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="812" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="838" y="284" font-size="24" fill="#27786b" font-weight="600">03</text><text x="838" y="337" font-size="27" fill="#183c37" font-weight="700">結果を検証</text><text x="838" y="391" font-size="21" fill="#526b65" font-weight="400">全件の存在と内容を確認</text><text x="838" y="429" font-size="21" fill="#526b65" font-weight="400">コピーと検証を別々に記録</text><path d="M1165 350 H1182" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1186" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="1212" y="284" font-size="24" fill="#27786b" font-weight="600">04</text><text x="1212" y="337" font-size="27" fill="#183c37" font-weight="700">完了記録を保存</text><text x="1212" y="391" font-size="21" fill="#526b65" font-weight="400">一覧と検証記録を残す</text><text x="1212" y="429" font-size="21" fill="#526b65" font-weight="400">あとから処理結果を照会</text><rect x="64" y="516" width="1472" height="92" rx="18" fill="#e5efe7" stroke="#c5d9cc" stroke-width="2"/><text x="90" y="553" font-size="25" fill="#183c37" font-weight="700">元の素材は保持する</text><text x="90" y="589" font-size="22" fill="#526b65" font-weight="400">この流れでは自動削除しません。元ファイルの削除は別途判断します。</text><text x="64" y="665" font-size="23" fill="#526b65" font-weight="400">異常時は状態とログを残し、完了した部分を確認してから再開方法を決めます。</text><text x="64" y="713" font-size="22" fill="#526b65" font-weight="400">過去の結果の照会は利用可能。状態変化の自動通知は今後の作業です。</text></g></svg>