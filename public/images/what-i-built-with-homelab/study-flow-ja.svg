<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
<title id="title">端末をまたぐ学習資料の流れ</title><desc id="desc">一元保管、パソコンでの転送と取り出し、iPad での読書は利用可能。OCR と学習記録のライフサイクル管理は今後の作業です。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#27786b" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="540" rx="24" fill="#f4f7f2"/>
<g font-family="Noto Sans CJK JP, Noto Sans CJK SC, sans-serif"><text x="64" y="65" font-size="24" fill="#27786b" font-weight="600">学習資料 / 端末をまたいで読む</text><text x="64" y="127" font-size="40" fill="#183c37" font-weight="700">保管した資料を、実際に読む端末へ届ける</text><rect x="64" y="185" width="450" height="145" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="90" y="240" font-size="26" fill="#183c37" font-weight="700">一か所に保管</text><text x="90" y="290" font-size="20" fill="#526b65" font-weight="400">学習資料の置き場所をまとめる</text><path d="M522 259 H554" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="564" y="185" width="450" height="145" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="590" y="240" font-size="26" fill="#183c37" font-weight="700">パソコンで転送・取り出し</text><text x="590" y="290" font-size="20" fill="#526b65" font-weight="400">資料を転送し、取り出す流れは利用可能</text><path d="M1022 259 H1054" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1064" y="185" width="450" height="145" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="1090" y="240" font-size="26" fill="#183c37" font-weight="700">iPad で読む</text><text x="1090" y="290" font-size="20" fill="#526b65" font-weight="400">読む端末に必要な資料を取り込む</text><rect x="64" y="378" width="1472" height="110" rx="18" fill="#faf9f5" stroke="#b7ae95" stroke-width="2" stroke-dasharray="9 7"/><text x="90" y="422" font-size="24" fill="#786a43" font-weight="600">今後の作業</text><text x="90" y="463" font-size="23" fill="#526b65" font-weight="400">OCR、学習記録のバックアップとライフサイクル管理は、引き続き今後の作業です。</text></g></svg>