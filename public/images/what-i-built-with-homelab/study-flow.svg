<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
<title id="title">学习资料跨设备工作流</title><desc id="desc">统一归档、电脑传输与取用、iPad 阅读已经落地；OCR 和学习记录生命周期仍在待办中。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#27786b" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="540" rx="24" fill="#f4f7f2"/>
<g font-family="Noto Sans CJK SC, Noto Sans Mono CJK SC, sans-serif"><text x="64" y="65" font-size="24" fill="#27786b" font-weight="600">学习资料  /  跨设备取用</text><text x="64" y="127" font-size="40" fill="#183c37" font-weight="700">让归档的资料走到实际阅读的设备上</text><rect x="64" y="185" width="450" height="145" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="90" y="240" font-size="30" fill="#183c37" font-weight="700">统一归档</text><text x="90" y="290" font-size="23" fill="#526b65" font-weight="400">把学习资料放在固定位置</text><path d="M522 259 H554" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="564" y="185" width="450" height="145" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="590" y="240" font-size="30" fill="#183c37" font-weight="700">电脑传输与取用</text><text x="590" y="290" font-size="23" fill="#526b65" font-weight="400">已有资料传输和访问流程</text><path d="M1022 259 H1054" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1064" y="185" width="450" height="145" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="1090" y="240" font-size="30" fill="#183c37" font-weight="700">iPad 阅读</text><text x="1090" y="290" font-size="23" fill="#526b65" font-weight="400">将需要的资料取到阅读端</text><rect x="64" y="378" width="1472" height="110" rx="18" fill="#faf9f5" stroke="#b7ae95" stroke-width="2" stroke-dasharray="9 7"/><text x="90" y="422" font-size="24" fill="#786a43" font-weight="600">后续工作</text><text x="90" y="463" font-size="24" fill="#526b65" font-weight="400">OCR 文字识别，以及学习记录的备份与生命周期管理，仍在待办中。</text></g></svg>