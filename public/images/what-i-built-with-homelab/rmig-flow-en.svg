<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">rmig media migration workflow</title><desc id="desc">Review the manifest, copy, verify and retain completion records. Source media is kept.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#27786b" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="760" rx="24" fill="#f4f7f2"/>
<g font-family="Noto Sans CJK SC, Noto Sans Mono CJK SC, sans-serif"><text x="64" y="65" font-size="24" fill="#27786b" font-weight="600">RMIG / MEDIA MIGRATION</text><text x="64" y="129" font-size="40" fill="#183c37" font-weight="700">Verify the batch after the copy</text><text x="64" y="178" font-size="23" fill="#526b65" font-weight="400">Workflow illustration · photo and video migrations that retain source files</text><rect x="64" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="90" y="284" font-size="24" fill="#27786b" font-weight="600">01</text><text x="90" y="337" font-size="24" fill="#183c37" font-weight="700">Review the manifest</text><text x="90" y="391" font-size="19" fill="#526b65" font-weight="400">Identify the files in the batch</text><text x="90" y="429" font-size="19" fill="#526b65" font-weight="400">Confirm source and destination</text><path d="M417 350 H434" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="438" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="464" y="284" font-size="24" fill="#27786b" font-weight="600">02</text><text x="464" y="337" font-size="24" fill="#183c37" font-weight="700">Copy to destination</text><text x="464" y="391" font-size="19" fill="#526b65" font-weight="400">Use the transfer tools</text><text x="464" y="429" font-size="19" fill="#526b65" font-weight="400">Keep progress and job logs</text><path d="M791 350 H808" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="812" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="838" y="284" font-size="24" fill="#27786b" font-weight="600">03</text><text x="838" y="337" font-size="24" fill="#183c37" font-weight="700">Verify the results</text><text x="838" y="391" font-size="19" fill="#526b65" font-weight="400">Check completeness and hashes</text><text x="838" y="429" font-size="19" fill="#526b65" font-weight="400">Record copy and check results</text><path d="M1165 350 H1182" fill="none" stroke="#27786b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1186" y="240" width="350" height="235" rx="18" fill="#fff" stroke="#b9d0c8" stroke-width="2"/><text x="1212" y="284" font-size="24" fill="#27786b" font-weight="600">04</text><text x="1212" y="337" font-size="24" fill="#183c37" font-weight="700">Keep a completion record</text><text x="1212" y="391" font-size="19" fill="#526b65" font-weight="400">Save manifests and check logs</text><text x="1212" y="429" font-size="19" fill="#526b65" font-weight="400">Look up this batch later</text><rect x="64" y="516" width="1472" height="92" rx="18" fill="#e5efe7" stroke="#c5d9cc" stroke-width="2"/><text x="90" y="553" font-size="25" fill="#183c37" font-weight="700">Keep the original media</text><text x="90" y="589" font-size="22" fill="#526b65" font-weight="400">No automatic deletion in this flow; decide separately whether to remove source files.</text><text x="64" y="665" font-size="23" fill="#526b65" font-weight="400">On failure: keep state and logs, check what finished, then decide how to continue.</text><text x="64" y="713" font-size="22" fill="#526b65" font-weight="400">Historical result queries are connected; automatic state-change notifications are still pending.</text></g></svg>